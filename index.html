<!doctype html>
<html lang="pt-BR" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MOVIERANK</title>
    <link href="css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body class="bg-dark text-light">
    <!-- ----- TOPO ----- -->
    <nav class="navbar sticky-top barra">
      <div class="container">
        <a class="navbar-brand marca" href="#"
          ><i class="bi bi-film"></i> MOVIERANK</a
        >
        <div class="d-flex align-items-center gap-2">
          <button
            class="btn btn-sm btn-icone"
            id="bTema"
            aria-label="Alternar tema"
          >
            <i class="bi bi-moon-stars"></i>
          </button>
          <div class="d-flex align-items-center gap-2" id="conta"></div>
        </div>
      </div>
    </nav>

    <!-- ----- PAGINA PRINCIPAL ----- -->
    <main class="container py-4">
      
      <section id="hero" class="mb-5" aria-label="Destaque"></section>

      <!-- Mais bem avaliados -->
      <section id="destaques" class="mb-5" hidden>
        <div class="d-flex justify-content-between align-items-end mb-2">
          <h2 class="secao">Mais bem avaliados</h2>
          <div class="btn-group btn-group-sm">
            <button class="btn btn-icone" id="faixaAnt" aria-label="Anteriores">
              <i class="bi bi-chevron-left"></i>
            </button>
            <button class="btn btn-icone" id="faixaProx" aria-label="Próximos">
              <i class="bi bi-chevron-right"></i>
            </button>
          </div>
        </div>
        <div class="faixa" id="faixa"></div>
      </section>

      <!-- ----- Catalogo  ----- -->
      <section aria-label="Catálogo">
        <div class="d-flex justify-content-between align-items-end mb-3">
          <h2 class="secao mb-0">
            Catálogo
            <small
              class="text-body-secondary fw-normal fs-6"
              id="contagem"
            ></small>
          </h2>
        </div>
        <div class="row g-2 mb-3">
          <div class="col-12 col-md-5">
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-search"></i></span>
              <input
                type="search"
                id="busca"
                class="form-control"
                placeholder="Buscar por título"
                aria-label="Buscar por título"
              />
            </div>
          </div>
          <div class="col-7 col-md-4">
            <div class="btn-group w-100" role="group" aria-label="Tipo">
              <input
                type="radio"
                class="btn-check"
                name="tipo"
                id="t1"
                value=""
                checked
              />
              <label class="btn btn-filtro" for="t1">Todos</label>
              <input
                type="radio"
                class="btn-check"
                name="tipo"
                id="t2"
                value="Filme"
              />
              <label class="btn btn-filtro" for="t2">Filmes</label>
              <input
                type="radio"
                class="btn-check"
                name="tipo"
                id="t3"
                value="Série"
              />
              <label class="btn btn-filtro" for="t3">Séries</label>
            </div>
          </div>
          <div class="col-5 col-md-3">
            <select id="ordem" class="form-select" aria-label="Ordenar">
              <option value="nota">Melhor nota</option>
              <option value="az">A–Z</option>
              <option value="ano">Mais recentes</option>
            </select>
          </div>
        </div>
        <!-- Chips de genero -->
        <div class="chips mb-4" id="chips" aria-label="Gêneros"></div>
        <div
          class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-xl-6 g-3"
          id="lista"
        ></div>
      </section>
    </main>

    <footer class="container pb-4 small text-body-secondary">
      Dados de filmes e séries: IMDb (via OMDb API).
    </footer>

    <!-- ----- JANELAS ----- -->

    <!-- Janela 1: login / cadastro -->
    <div class="modal fade" id="mAuth" tabindex="-1" aria-labelledby="authTitulo" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header border-0">
            <h2 class="modal-title fs-4 titulo-fonte" id="authTitulo">Entrar</h2>
            <button class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
          </div>
          <form class="modal-body pt-0" id="fAuth">
            <div class="mb-2" id="gNome" hidden>
              <label class="form-label" for="aNome">Nome</label>
              <input class="form-control" id="aNome" autocomplete="name" />
            </div>
            <div class="mb-2">
              <label class="form-label" for="aEmail">E-mail</label>
              <input class="form-control" id="aEmail" type="email" required autocomplete="email" />
            </div>
            <div class="mb-2">
              <label class="form-label" for="aSenha">Senha</label>
              <input class="form-control" id="aSenha" type="password" required minlength="6" autocomplete="current-password" />
            </div>
            <div class="text-danger small mb-2" id="aErro" role="alert"></div>
            <button class="btn btn-primary w-100" id="aBtn">Entrar</button>
            <button type="button" class="btn btn-link w-100 mt-1" id="aTroca">Não tem conta? Cadastre-se</button>
          </form>
        </div>
      </div>
    </div>

    <!-- Janela 2: adicionar titulo -->
    <div class="modal fade" id="mNovo" tabindex="-1" aria-labelledby="novoTitulo" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header border-0">
            <h2 class="modal-title fs-4 titulo-fonte" id="novoTitulo">Adicionar título</h2>
            <button class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
          </div>
          <div class="modal-body pt-0">
            <form id="fBusca" class="input-group mb-2">
              <input class="form-control" id="bQ" required placeholder="Buscar no IMDb (ex.: Interestelar)" aria-label="Buscar no IMDb" />
              <button class="btn btn-primary">Buscar</button>
            </form>
            <div id="resImdb" class="list-group mb-2"></div>
            <div class="text-danger small mb-2" id="bErro" role="alert"></div>
            <details>
              <summary class="small mb-2">Não achou? Cadastrar manualmente</summary>
              <form id="fNovo">
                <div class="mb-2">
                  <label class="form-label" for="nNome">Nome</label>
                  <input class="form-control" id="nNome" required />
                </div>
                <div class="row g-2 mb-2">
                  <div class="col-6">
                    <label class="form-label" for="nTipo">Tipo</label>
                    <select class="form-select" id="nTipo">
                      <option>Filme</option>
                      <option>Série</option>
                    </select>
                  </div>
                  <div class="col-6">
                    <label class="form-label" for="nAno">Ano</label>
                    <input class="form-control" id="nAno" type="number" min="1888" max="2100" />
                  </div>
                </div>
                <div class="mb-2">
                  <label class="form-label" for="nGenero">Gênero</label>
                  <input class="form-control" id="nGenero" placeholder="Ex.: Drama, Suspense" />
                </div>
                <div class="text-danger small mb-2" id="nErro" role="alert"></div>
                <button class="btn btn-primary w-100">Salvar título</button>
              </form>
            </details>
          </div>
        </div>
      </div>
    </div>

    <!-- Janela 3: detalhes e avaliação de um titulo -->
    <div class="modal fade" id="mTitulo" tabindex="-1" aria-labelledby="mNome" aria-hidden="true">
      <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content overflow-hidden">
          <button class="btn-close fechar-flutuante" data-bs-dismiss="modal" aria-label="Fechar"></button>
          <div class="modal-body p-0">
            <div class="row g-0">
              <div class="col-md-4 d-none d-md-block">
                <div class="poster-grande" id="mPoster"></div>
              </div>
              <div class="col-md-8 p-4">
                <h2 class="titulo-fonte fs-2 mb-1" id="mNome"></h2>
                <div class="d-flex flex-wrap gap-2 mb-3" id="mMeta"></div>
                <div class="row g-3 mb-3">
                  <div class="col-sm-4">
                    <div class="placar">
                      <span class="placar-n" id="mImdb">–</span>
                      <span class="placar-l">Nota no IMDb</span>
                    </div>
                  </div>
                  <div class="col-sm-4">
                    <div class="placar">
                      <span class="placar-n" id="mUsers">–</span>
                      <span class="placar-l" id="mUsersL">Nota do MOVIERANK</span>
                    </div>
                  </div>
                  <div class="col-sm-4">
                    <div id="mDist" class="dist"></div>
                  </div>
                </div>
                <p class="text-body-secondary" id="mSinopse"></p>
                <hr />
                <div id="blocoAvaliar"></div>
                <h3 class="fs-6 mt-4 mb-2">Avaliações</h3>
                <div id="avaliacoes"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Aviso (toast) -->
    <div class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3">
      <div id="aviso" class="toast text-bg-dark" role="status" aria-live="polite">
        <div class="toast-body" id="avisoTxt"></div>
      </div>
    </div>

    <!-- ================= SCRIPTS ================= -->
    <script src="js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
